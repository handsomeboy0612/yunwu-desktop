# Desktop Host operations compose around the existing Web bundle.
#
# The `mode` value below is a declaration, not the switch: the launcher rewrites
# this row's `mode` from the settings document on every boot (profile.ts, the
# `desktop-shell` patch near the end of prepareDesktopProfile). The product
# default lives in `DEFAULT_DESKTOP_SHELL_MODE` (src/runtime.ts) and a guard test
# keeps the two equal, so change both together or neither.
#
# `desktop-updates` is deliberately absent. Its endpoints are module-level
# constants in update-checker.ts and update-download.ts pointing at
# www.dshdesktop.cn, so a mounted row would have this product check upstream's
# release service and offer upstream's installer. Dropping the row — rather
# than setting its `enabled: false` — leaves no code path that can reach those
# constants. Re-add a row here once our own release service exists.
# Notifications are unaffected: `runtime.updates.notify` is a method on
# ElectronDesktopRuntime, not on this plugin.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: advanced
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    # OpenLux account. Resolvable by bare name because it is a dependency of
    # this package: app-boot walks the desktop manifest's dependency closure and
    # symlinks each package into $DSH_HOME/profiles/node_modules, which Node
    # finds on the parent walk from any profile (app-boot/src/profile.ts:223).
    - id: openlux-account
      name: openlux-plugin-account
    # The fetch backend for `web_fetch`, which the base bundle leaves unmounted.
    # Enabling it is a security statement, so the reasoning is with the row that
    # turns the tool on, further down this file. Order is free: the plugin
    # injects `web` and `tools` and stays pending until both mount.
    #
    # `@deepseek-ai/dsh-web-fetch-http` is NOT mounted directly. That package's
    # provider defers private-network protection to its deployment (its own
    # `provider.d.ts` says so) and this row wraps it: classify the target, then
    # use it as the transport. Mounting it here as well would leave an unguarded
    # `http` provider in the registry for one line of config to select, so the
    # only usable fetch provider in this product is the guarded one — the `web`
    # row below still names it, but selection would land here regardless.
    # Config is upstream's schema, so the caps live in one place.
    - id: web-fetch-guard
      name: dsh-plugin-desktop/web-fetch-guard
      config:
        # Above the tool-call budget on purpose. This timer is the provider's own
        # resource guard for direct `ctx.web.fetch()` callers; its README asks
        # deployments to keep it higher than the model-facing budget so an
        # overrun is reported as TOOL_TIMEOUT by the timeout policy rather than
        # as the provider's WEB_FETCH_TIMEOUT. Both defaults are 30s, which is
        # not higher.
        timeoutMs: 45000

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# The attachment store's per-image ceiling, raised from upstream's 5 MB default.
#
# That default is a coding harness's number, and we inherited it rather than
# chose it. This product generates pictures, and one of the vendors it draws
# with cannot fit under it at all: MJ `imagine` answers with a single 2×2 grid
# image, measured at 8.5 MB on 2026-08-21, so every MJ call drew successfully,
# was billed, and then failed to save — the picture existed and the user never
# saw it.
#
# 32 MB is this product's own precedent, not a number picked to clear that one
# case: the openclaw-era plugin capped media artifacts at exactly this
# (`resources/yunwu-video-plugin/index.mjs`, `DEFAULT_MAX_BYTES = 32 * 1024 *
# 1024`, tied to the kernel's `agents.defaults.mediaMaxMb`), so MJ's grid passed
# comfortably in the shipped predecessor.
#
# What it costs, stated plainly: this ceiling also bounds `read_image` and
# pasted images, which unlike generated ones *do* enter model requests and are
# billed on every later request until compaction. So a user can now put a much
# larger photo in front of the model than before. `maxImagePixels` (40 MP) is
# left at its default and still guards the decode, and the provider applies its
# own limits, so the exposure is cost rather than breakage.
- id: attachment-local
  config:
    maxImageBytes: 33554432

# Our relay route, supplied as the composition base for the `llm-pi-ai` adapter
# the Web bundle mounts dormant. It belongs here rather than in the user's
# settings document because none of it is a per-user fact: the endpoint is our
# own service, and apiKeyEnv is a reference the credential store answers per
# request, not a secret.
#
# Why this adapter and not `llm-deepseek`, which stays mounted beside it: the
# relay shards tool calls in a way the strict adapter cannot survive.
# Continuation deltas carry `"name": ""` and some first deltas omit `id`;
# translate.ts assigns both verbatim on `!== undefined`, so the empty string
# overwrites the name the first delta already delivered and the call arrives as
# `unknown tool ""`. Worse, a turn whose first delta omitted `id` persists a
# tool result with an empty callId, which core/session refuses on reload — the
# session never opens again. `llm-pi-ai` captures id and name once at
# `toolcall_start` and skips empty names (stream.ts:168-169), so the same
# stream parses. Both models called tools first try through this route; every
# attempt through the other one failed. `llm-deepseek` is left alone because it
# is still correct against DeepSeek directly.
- id: llm-pi-ai
  config:
    providers:
      openlux:
        displayName: OpenLux
        # A route pi-ai's installed catalog does not ship must name its protocol.
        api: openai-completions
        # Chat requests leave from here, while sign-in and the model pool leave
        # from the account plugin — one station serves both, so both read the
        # same variable and cannot drift apart. Unset means production. See the
        # `DEFAULT_BASE_URL` note in `openlux-plugin-account/src/index.ts` for
        # why a local relay must be spelled `localhost`.
        baseURL: !!js "(process.env.OPENLUX_BASE_URL ?? 'https://api.openlux.ai') + '/v1'"
        # Must equal what the Models page derives from the route id
        # (`<ROUTE>_API_KEY`): that page only clears a credential on row delete
        # when the reference matches its own derived target, so a name chosen
        # freely here would leave the key on disk after the user removes us.
        apiKeyEnv: OPENLUX_API_KEY
        # Default is 300s (llm-pi-ai/src/config.ts:35). A relay channel that
        # stalls should reach the retry plugin as a failure while the user is
        # still watching, not after five minutes of an idle spinner.
        streamIdleTimeoutMs: 90000
        # The offline floor, not the catalog. Settings layers merge per key, but
        # an array replaces the layer below it wholesale, so the catalog pulled
        # from admin-server overwrites this list cleanly rather than adding to it.
        models:
          - id: deepseek-v4-pro
            name: OpenLux V4-Pro
          - id: deepseek-v4-flash
            name: OpenLux V4-Flash

# The base bundle's native DeepSeek adapter, switched off rather than left to
# sit beside ours. Mounted, it publishes its own `deepseek-official` route with
# two default models, so the picker offers four DeepSeek rows of which two need
# a DEEPSEEK_API_KEY nobody signing in with an OpenLux account has. Picking one
# is worse than an error: that adapter is the one whose stream parser our relay
# breaks (see the note above this file's llm-pi-ai row), and the empty callId it
# then persists makes the session refuse to reopen.
#
# `disabled` rather than a dropped row: the row is upstream's, so this states our
# intent where a merge conflict will show it, and a user who brings their own
# DeepSeek key can flip it back.
- id: llm-deepseek
  disabled: true

# Point new installs at our route. The base bundle ships
# `provider: deepseek-official` (bundle/base/cordis.patch.yml:63-67), which asks
# for a DEEPSEEK_API_KEY nobody signing in with an OpenLux account will ever
# have — a machine with no settings.yaml answered its first message with
# MISSING_CREDENTIAL while the picker cheerfully read "DeepSeek-V4-Flash".
#
# This row is the composition entry `agent-default-model` installs as its
# settings base, so a user who picks another model still overrides it through
# the user layer; only the factory floor moves.
- id: agent-default-model
  config:
    provider: openlux
    model: deepseek-v4-flash

# Upstream's own search provider, re-pointed at our route. Nothing here is code:
# `ctx.web` owns provider selection, `dsh-tool-web` owns the `web_search` name,
# schema, prompt guidance and result card, and this row is the base layer of the
# `web-search-deepseek` settings section — so a user layer still moves the
# endpoint or model for the next search.
#
# Why it needs re-pointing at all: the base bundle mounts the provider with a
# DEEPSEEK_API_KEY reference, and tool registration follows product enablement
# rather than backend availability. So `web_search` sits in every request's
# schema while nobody signing in with an OpenLux account holds that credential,
# and each call fails WEB_PROVIDER_CREDENTIAL_MISSING. The tool was on offer and
# could not work.
#
# Why Anthropic Messages and a claude model, when every other row here speaks
# completions: this provider needs *structured* results and refuses by design to
# scrape URLs out of model prose. Measured on our route (2026-08-18):
#
#   - `/v1/messages` on a deepseek channel answers HTTP 500 `channel deepseek
#     does not support Claude format`, so the provider's default model is out.
#   - `deepseek-v3-search` on completions does retrieve (2542 prompt tokens of
#     injected context, 9.6s) but answers with prose only. No citation field
#     survives the relay, so there is nothing to map into `sources[]`.
#   - `claude-haiku-4-5-20251001` with the native `web_search_20250305` server
#     tool returned ten `web_search_result` items carrying `url` / `title` /
#     `page_age`, plus ten text-block citations, in 7.7s. Those are exactly the
#     fields this provider maps.
#
# `baseURL` ends in `/v1` because the provider appends `/messages`. The model is
# a square model, so its usage bills to the same account as everything else, and
# the credential resolves per search rather than at registration: a signed-out
# machine fails that one call and keeps a stable schema.
#
# The registered id stays `deepseek-official` (that is the name `web` selects);
# only its endpoint and model move. Registering an id of our own would mean
# writing a provider for behaviour this configuration already buys.
- id: web-search-deepseek
  config:
    apiKeyEnv: OPENLUX_API_KEY
    baseURL: !!js "(process.env.OPENLUX_BASE_URL ?? 'https://api.openlux.ai') + '/v1'"
    model: claude-haiku-4-5-20251001

# Name both providers explicitly. For fetch this is a statement rather than a
# load-bearing switch (ours is the only usable one mounted); for search it is
# load-bearing, because two usable providers are now registered and an unnamed
# selection would fail as WEB_PROVIDER_AMBIGUOUS
# (`dsh-web/lib/index.js:130`).
#
# Search goes to our own provider because the console has always delivered a
# *priority list* for this purpose and promised on the page that a bad first
# entry falls through to the next one. Upstream's provider calls exactly one
# model and its section carries a singular `model`, so nothing there could ever
# consume that list — the whole degradation was missing, not broken
# (`openlux-plugin-account/src/web/search/provider.ts`). Ours sends the same
# Anthropic Messages request with the same native search tool as its first
# choice, following that package's reply-handling judgements to the letter, then
# tries two more vendor families when this key has no Claude channel.
#
# `deepseek-official` stays mounted and re-pointed above: it is the escape hatch
# a user layer can name if ours ever misbehaves.
#
# Patch of `config` is wholesale replacement (`applyEntryPatches` assigns the
# key), so both keys have to be written here or the missing one goes back to
# "exactly one usable provider".
- id: web
  config:
    searchProvider: openlux-search
    fetchProvider: openlux-http

# Let the model read a page it found, instead of guessing from a snippet. The
# base bundle ships `fetch: false` and states why in its own comment: no fetch
# provider is mounted, and that provider defers SSRF protection while the model
# picks the target. Both halves are true of upstream. The first is the reason
# for the `web-fetch-guard` row above; the second is what that row answers —
# literals are refused by a `tools.guard`, and the resolved addresses are
# classified before upstream's provider is used as transport. Ranges and
# embedded-IPv4 rules come from openclaw's net-policy, so this product's reach
# is not wider than the kernel generation it is migrating from. The residual
# window is stated in `src/web-fetch-guard.ts`: the transport re-resolves at
# connect time, which no seam in that package lets us pin.
#
# What decides it here is that the boundary in question is already open. The
# sandbox governs file effects only — its README says network and process policy
# are outside that vocabulary and offers no knob for them — and every permission
# preset composes a shell (`tool-bash`, or `tool-pwsh`, which is the one this
# product ships on Windows). So the agent can already reach anything this machine
# can reach, uncapped and with no content rules. The provider is strictly
# narrower: http(s) only, credentials in the URL rejected, same-origin redirects
# only, 5MB response and 100k-character caps, text content types only, and an
# honest product User-Agent. This row buys a capped read path, not new reach.
#
# It would NOT be defensible in a hosted or shared-host deployment, where the
# harness runs inside a network its operator is not entitled to browse. If this
# product ever grows that shape, this row comes off with it.
#
# Fetch is turned on by re-enabling the host row that `dsh-web-app` disabled,
# and that placement is a deliberate divergence worth stating.
#
# Where upstream put the knob: the model-facing web tools are mounted per agent
# preset, so `fetch` lives in each preset's own `tool-web` row
# (`config/agent-presets/*/agent.cordis.yml`, and the shipped `standard` inside
# the dsh CLI). The preset layer has no patch semantics — `dsh-agent-presets`
# says changing one row of a shipped preset means copying the whole directory,
# and that copies drift because an upgrade does not update them. Our product
# default IS the shipped read-only `standard`, so honouring the preset plane
# would mean either leaving the default without fetch or carrying a third full
# copy of upstream's default preset that silently stops inheriting its changes.
#
# So this row instead registers `web_fetch` into the global tool layer, which is
# where our `image_generate` already lives: every agent sees it whatever preset
# it composed from, and there is nothing to keep in sync. `tools.restrict()`
# remains the seam for an agent that must not have it.
#
# `search: false` keeps search where upstream put it. Each preset registers
# `web_search` with its own 60s budget, and a second global registration would
# add a contradicting prompt section rather than a second tool. The cost of the
# split is one sentence of guidance: a preset's search text only mentions
# following up with `web_fetch` when that same composition enabled fetch, so
# ours does not. The fetch tool's own section still names a `web_search` result
# as its example input, which is the chaining hint that matters.
- id: tool-web
  disabled: false
  config:
    search: false
    fetch: true
